<rect x="985" y="448" width="145" height="72" rx="5" fill="#eee0bd" stroke="#27180e" stroke-width="6" transform="rotate(5 1057 484)"/>
<text x="1008" y="484" font-family="Arial Black, sans-serif" font-size="18" fill="#21180e">CHANGE</text><text x="1018" y="506" font-family="Arial Black, sans-serif" font-size="18" fill="#21180e">LOG</text>
