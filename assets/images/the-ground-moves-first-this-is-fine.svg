</g>

<!-- speech bubble -->
<path d="M606 180h270q34 0 34 34v74q0 34-34 34H746l-44 44 8-44H606q-34 0-34-34v-74q0-34 34-34z" fill="#fff8e6" stroke="#17120d" stroke-width="8" filter="url(#shadow)"/>
<text x="635" y="270" font-family="Arial Black, sans-serif" font-size="42" fill="#17120d">THIS IS FINE.</text>

