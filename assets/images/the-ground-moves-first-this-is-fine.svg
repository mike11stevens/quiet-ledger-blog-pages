  <circle cx="557" cy="294" r="25" fill="#fff" stroke="#2a190e" stroke-width="6"/><circle cx="566" cy="298" r="9" fill="#17100b"/>
  <path d="M565 348q30 24 53 1" fill="none" stroke="#2a190e" stroke-width="6" stroke-linecap="round"/>
  <path d="M482 230q42-36 86 0l-10 35h-74z" fill="#7d4b25" stroke="#2a190e" stroke-width="7"/>
