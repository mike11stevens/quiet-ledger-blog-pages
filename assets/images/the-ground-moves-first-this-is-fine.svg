  <text x="755" y="483" font-family="Arial Black, sans-serif" font-size="14" fill="#b13a12">???</text><text x="833" y="483" font-family="Arial Black, sans-serif" font-size="14" fill="#b13a12">???</text>
</g>

<!-- desk details -->
<rect x="330" y="423" width="180" height="120" rx="5" fill="#e8d7af" stroke="#24180d" stroke-width="7" transform="rotate(-4 420 483)"/>
<text x="352" y="454" font-family="Arial Black, sans-serif" font-size="18" fill="#21180e">FOCUS</text>
<text x="352" y="481" font-family="Arial, sans-serif" font-size="17" fill="#21180e">CREATE CLARITY</text>
<text x="352" y="506" font-family="Arial, sans-serif" font-size="17" fill="#21180e">REDUCE FRICTION</text>
