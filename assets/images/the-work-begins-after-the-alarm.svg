<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The work begins after the alarm</title>
<desc id="desc">A warm comic-style office after a fire, with dogs rebuilding systems, sharing knowledge, and helping one another.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6e7bf"/><stop offset="1" stop-color="#e8c98b"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9a53f"/><stop offset="1" stop-color="#a96b22"/></linearGradient>
  <filter id="rough"><feTurbulence baseFrequency=".8" numOctaves="2" seed="7" type="fractalNoise" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#paper)"/>
<rect x="430" width="770" height="590" fill="url(#wall)"/>
<path d="M430 0h770v82c-90-34-174-6-266-21-99-17-188 22-285-4-74-20-144 18-219 3z" fill="#2f2923" opacity=".9"/>
<rect x="472" y="95" width="430" height="260" rx="8" fill="#f6eed8" stroke="#2b2118" stroke-width="8"/>
<text x="687" y="140" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" fill="#2b2118">LET'S MAKE IT BETTER</text>
<g font-family="Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#2b2118">
  <rect x="510" y="190" width="78" height="48" fill="#fff8e4" stroke="#2b2118" stroke-width="4"/><text x="549" y="220">LISTEN</text>
  <rect x="614" y="190" width="78" height="48" fill="#fff8e4" stroke="#2b2118" stroke-width="4"/><text x="653" y="220">LEARN</text>
  <rect x="718" y="190" width="78" height="48" fill="#fff8e4" stroke="#2b2118" stroke-width="4"/><text x="757" y="220">ADAPT</text>
  <rect x="822" y="190" width="78" height="48" fill="#fff8e4" stroke="#2b2118" stroke-width="4"/><text x="861" y="220">DELIVER</text>
</g>
<path d="M588 214h26m78 0h26m78 0h26" stroke="#2b2118" stroke-width="5" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#2b2118"/></marker></defs>
<text x="687" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#2b2118">FEEDBACK LOOP</text>
<path d="M850 247c0 60-84 78-163 78s-157-19-157-77" fill="none" stroke="#2b2118" stroke-width="4" stroke-dasharray="10 8"/>
<rect x="948" y="104" width="205" height="245" rx="8" fill="#f3e3b4" stroke="#2b2118" stroke-width="8"/>
<text x="1050" y="150" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" fill="#2b2118">SYSTEMS</text>
<text x="1050" y="180" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" fill="#2b2118">OVER HEROICS</text>
<path d="M1050 220v38m-55 0h110m-110 0v38m55-38v38m55-38v38" stroke="#2b2118" stroke-width="5"/>
<rect x="968" y="296" width="54" height="35" fill="#d49b35" stroke="#2b2118" stroke-width="4"/><rect x="1023" y="296" width="54" height="35" fill="#8fbd72" stroke="#2b2118" stroke-width="4"/><rect x="1078" y="296" width="54" height="35" fill="#d49b35" stroke="#2b2118" stroke-width="4"/>
<rect x="1005" y="375" width="155" height="70" rx="6" fill="#5b7c3a" stroke="#2b2118" stroke-width="6"/><text x="1082" y="420" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#fff7dc">EXIT</text>
<!-- table -->
<path d="M460 520h700v38H460zM500 558h28v170h-28zm585 0h28v170h-28z" fill="#6b351b" stroke="#2b2118" stroke-width="6"/>
<!-- laptop -->
<path d="M706 452h235l-20 145H690z" fill="#333" stroke="#211914" stroke-width="7"/><rect x="730" y="480" width="170" height="78" fill="#172b32"/><text x="815" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#8bd4e6">AI ASSISTANT</text><text x="755" y="540" font-family="Arial, sans-serif" font-size="15" fill="#f7f0d7">✓ FIND KNOWLEDGE</text><text x="755" y="560" font-family="Arial, sans-serif" font-size="15" fill="#f7f0d7">✓ CONNECT THE DOTS</text>
<!-- dogs -->
<g stroke="#2b2118" stroke-width="6">
  <ellipse cx="575" cy="452" rx="72" ry="86" fill="#d59a31"/><circle cx="550" cy="421" r="20" fill="#fff"/><circle cx="598" cy="421" r="20" fill="#fff"/><circle cx="555" cy="424" r="8" fill="#111"/><circle cx="603" cy="424" r="8" fill="#111"/><ellipse cx="636" cy="451" rx="30" ry="20" fill="#2b2118"/><path d="M510 393q-38-44-50 18v70" fill="#1f1a17"/><path d="M565 370q18-34 43 0" fill="#7f4b21"/>
  <ellipse cx="1010" cy="520" rx="67" ry="82" fill="#d59a31"/><circle cx="988" cy="491" r="18" fill="#fff"/><circle cx="1030" cy="491" r="18" fill="#fff"/><circle cx="992" cy="494" r="7"/><circle cx="1034" cy="494" r="7"/><ellipse cx="1063" cy="520" rx="27" ry="18" fill="#2b2118"/><path d="M955 462q-34-40-47 17v67" fill="#1f1a17"/>
</g>
<text x="200" y="90" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2b2118">The healthier lesson isn't pretending</text>
<text x="200" y="132" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#2b2118">everything is fine.</text>
<text x="80" y="210" font-family="Arial, sans-serif" font-size="29" fill="#2b2118">It is recognizing the fire, helping people</text>
<text x="80" y="250" font-family="Arial, sans-serif" font-size="29" fill="#2b2118">find the exits, improving the wiring, and</text>
<text x="80" y="290" font-family="Arial, sans-serif" font-size="29" fill="#2b2118">leaving the building safer than you found it.</text>
<text x="600" y="690" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="54" fill="#211914">THE WORK BEGINS AFTER THE ALARM.</text>
<text x="600" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#2b2118">Calm &gt; Denial.  Clarity &gt; Chaos.  Action &gt; Apology.</text>
</svg>