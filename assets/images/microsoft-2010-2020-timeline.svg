  <text x="465" y="245" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Satya Nadella named CEO</text>

  <!-- 2016: Microsoft -->
  <line x1="686" y1="392" x2="686" y2="315" stroke="#0969da" stroke-width="3"/>
  <circle cx="686" cy="392" r="10" fill="#0969da" stroke="#ffffff" stroke-width="4"/>
  <rect x="615" y="274" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="633" y="303" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">NOV 2016</text>
  <text x="633" y="329" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Joins the Linux Foundation</text>

  <!-- 2018: Microsoft -->
  <line x1="850" y1="392" x2="850" y2="235" stroke="#0969da" stroke-width="3"/>
  <circle cx="850" cy="392" r="10" fill="#0969da" stroke="#ffffff" stroke-width="4"/>
  <rect x="780" y="180" width="205" height="98" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="798" y="209" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">JUN 2018</text>
  <text x="798" y="235" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Microsoft announces</text>
  <text x="798" y="258" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">GitHub acquisition</text>

  <!-- 2019: Personal -->
  <line x1="982" y1="392" x2="982" y2="510" stroke="#57606a" stroke-width="3"/>
  <circle cx="982" cy="392" r="10" fill="#57606a" stroke="#ffffff" stroke-width="4"/>
  <rect x="845" y="510" width="248" height="82" rx="10" fill="#eaeef2" stroke="#8c959f"/>
