    <circle cx="992" cy="222" r="6"/>
    <circle cx="1090" cy="158" r="6"/>
  </g>
  <g fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
    <text x="84" y="336">$27.91</text>
    <text x="1040" y="142">$222.42</text>
    <text x="1118" y="384">$0</text>
    <text x="1118" y="284">$100</text>
    <text x="1118" y="184">$200</text>
  </g>
  <line x1="1108" y1="150" x2="1108" y2="380" stroke="#1a7f37" stroke-width="2" stroke-opacity="0.65"/>
  <g stroke="#1a7f37" stroke-width="2" stroke-opacity="0.65">
