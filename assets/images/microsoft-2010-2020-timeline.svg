  <text x="214" y="329" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Office 365 launches</text>

  <!-- 2013: Personal -->
  <line x1="407" y1="392" x2="407" y2="610" stroke="#57606a" stroke-width="3"/>
  <circle cx="407" cy="392" r="10" fill="#57606a" stroke="#ffffff" stroke-width="4"/>
  <rect x="329" y="610" width="220" height="102" rx="10" fill="#eaeef2" stroke="#8c959f"/>
  <text x="347" y="640" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">2013</text>
  <text x="347" y="666" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Move to Germany</text>
  <text x="347" y="689" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Support USAFE-AFAFRICA</text>

  <!-- 2014: Microsoft -->
  <line x1="520" y1="392" x2="520" y2="235" stroke="#0969da" stroke-width="3"/>
  <circle cx="520" cy="392" r="10" fill="#0969da" stroke="#ffffff" stroke-width="4"/>
  <rect x="447" y="190" width="220" height="78" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
