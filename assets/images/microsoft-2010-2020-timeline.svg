  <text x="80" y="566" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Join Microsoft as a PFE</text>

  <!-- 2011: Microsoft -->
  <line x1="270" y1="392" x2="270" y2="315" stroke="#0969da" stroke-width="3"/>
  <circle cx="270" cy="392" r="10" fill="#0969da" stroke="#ffffff" stroke-width="4"/>
  <rect x="196" y="274" width="202" height="78" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
