<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Microsoft and Mike Stevens, 2010 to 2020</title>
  <desc id="timeline-desc">A parallel timeline showing Microsoft milestones above the line and Mike Stevens's career milestones below it, with Microsoft's year-end stock closing price overlaid from 2010 through 2020. Company milestones include Azure general availability, Office 365 launching, Satya Nadella becoming CEO, Microsoft joining the Linux Foundation, and Microsoft acquiring GitHub. Personal milestones include joining Microsoft, moving to Germany to support USAFE, returning to the United States and joining Enterprise Skills Initiative, and teaching Azure in Cincinnati at the ten-year mark.</desc>

  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <text x="70" y="83" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">Ten years of change</text>
  <text x="70" y="116" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Microsoft's cloud transformation—and a career evolving with it</text>

  <circle cx="82" cy="153" r="7" fill="#0969da"/>
  <text x="98" y="160" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">MICROSOFT MILESTONES</text>
  <circle cx="314" cy="153" r="7" fill="#57606a"/>
  <text x="330" y="160" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">MY MILESTONES</text>
  <circle cx="837" cy="153" r="7" fill="#1a7f37"/>
  <text x="853" y="160" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">MSFT YEAR-END CLOSE</text>

  <!-- MSFT unadjusted year-end closing price, USD -->
  <path d="M112 352 L210 354 L308 353 L405 343 L503 334 L601 325 L699 318 L797 294 L894 278 L992 222 L1090 158 L1090 380 L112 380 Z" fill="#1a7f37" fill-opacity="0.10"/>
  <polyline points="112,352 210,354 308,353 405,343 503,334 601,325 699,318 797,294 894,278 992,222 1090,158" fill="none" stroke="#1a7f37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#1a7f37" stroke="#ffffff" stroke-width="3">
    <circle cx="112" cy="352" r="6"/>
    <circle cx="210" cy="354" r="6"/>
    <circle cx="308" cy="353" r="6"/>
