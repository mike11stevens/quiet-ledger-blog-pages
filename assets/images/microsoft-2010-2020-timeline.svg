  <text x="70" y="757" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Company milestones: official Microsoft announcements • Stock: unadjusted year-end close, USD • Personal milestones: Ten Years at Microsoft</text>
