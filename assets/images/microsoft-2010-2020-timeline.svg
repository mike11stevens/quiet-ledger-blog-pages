  <line x1="92" y1="392" x2="1108" y2="392" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>

  <!-- 2010: Microsoft -->
  <line x1="112" y1="392" x2="112" y2="235" stroke="#0969da" stroke-width="3"/>
  <circle cx="112" cy="392" r="10" fill="#0969da" stroke="#ffffff" stroke-width="4"/>
  <rect x="62" y="180" width="205" height="98" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="80" y="209" fill="#0550ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">FEB 2010</text>
  <text x="80" y="235" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Azure becomes generally</text>
  <text x="80" y="258" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">available</text>

  <!-- 2010: Personal -->
  <line x1="112" y1="392" x2="112" y2="510" stroke="#57606a" stroke-width="3"/>
  <rect x="62" y="510" width="205" height="82" rx="10" fill="#eaeef2" stroke="#8c959f"/>
