  <path d="M94 148h1012" stroke="#d0d7de" stroke-width="3"/>
  <circle cx="138" cy="112" r="12" fill="#ff5f56"/>
  <circle cx="178" cy="112" r="12" fill="#ffbd2e"/>
  <circle cx="218" cy="112" r="12" fill="#27c93f"/>
  <text x="260" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#57606a">career-plan.md</text>
