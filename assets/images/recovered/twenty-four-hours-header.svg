<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">24 Hours in a day</title>
  <desc id="desc">A GitHub-light style header graphic showing a day sliced into 24 hours and a reminder that priority is the hard part.</desc>
  <rect width="1200" height="675" fill="#f6f8fa"/>
  <rect x="92" y="72" width="1016" height="531" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="3"/>
  <path d="M92 166h1016" stroke="#d8dee4" stroke-width="3"/>
  <circle cx="138" cy="119" r="13" fill="#ff5f56"/>
  <circle cx="182" cy="119" r="13" fill="#ffbd2e"/>
  <circle cx="226" cy="119" r="13" fill="#27c93f"/>
  <text x="270" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#57606a">day-planner.md</text>
  <text x="154" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#24292f">24 Hours in a day</text>
  <text x="158" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#57606a">Same hours. Different priorities. Mildly rude math.</text>
  <g transform="translate(170 392)">
    <rect x="0" y="0" width="860" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <g fill="#0969da">
      <rect x="28" y="24" width="28" height="36" rx="4"/>
      <rect x="70" y="18" width="28" height="42" rx="4"/>
      <rect x="112" y="32" width="28" height="28" rx="4"/>
      <rect x="154" y="12" width="28" height="48" rx="4"/>
      <rect x="196" y="38" width="28" height="22" rx="4"/>
      <rect x="238" y="26" width="28" height="34" rx="4"/>
    </g>
    <text x="305" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#24292f">Available capacity: 24h</text>
    <text x="646" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#57606a">Scope: lol, good luck</text>
  </g>
  <text x="158" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#57606a">Please stop saying “I don’t have time” in front of Future Me.</text>
</svg>
