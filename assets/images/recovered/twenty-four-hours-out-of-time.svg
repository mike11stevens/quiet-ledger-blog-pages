<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Out of Time joke card</title>
  <desc id="desc">A simple original card riffing on being out of time without using album art.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <rect x="64" y="54" width="772" height="412" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="3"/>
  <circle cx="450" cy="260" r="122" fill="#24292f"/>
  <circle cx="450" cy="260" r="42" fill="#f6f8fa" stroke="#d0d7de" stroke-width="3"/>
  <circle cx="450" cy="260" r="12" fill="#24292f"/>
  <text x="450" y="121" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#24292f">OUT OF TIME</text>
  <text x="450" y="416" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#57606a">great album, questionable scheduling strategy</text>
  <text x="450" y="452" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#57606a">Best song: Country Feedback? Discuss amongst yourselves.</text>
</svg>
