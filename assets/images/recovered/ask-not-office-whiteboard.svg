<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Whiteboard quote inspired by The Office</title>
  <desc id="desc">A whiteboard-style illustration with the Wayne Gretzky quote and Michael Scott attribution joke.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#24292f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#eaeef2"/>
  <rect x="0" y="0" width="1200" height="675" filter="url(#paper)"/>
  <rect x="92" y="66" width="1016" height="510" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="8" filter="url(#softShadow)"/>
  <rect x="135" y="112" width="930" height="374" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="3"/>
  <rect x="150" y="503" width="900" height="18" rx="9" fill="#d0d7de"/>
  <rect x="744" y="514" width="118" height="18" rx="9" fill="#0969da"/>
  <rect x="880" y="514" width="108" height="18" rx="9" fill="#cf222e"/>
  <text x="176" y="202" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="56" fill="#0969da" transform="rotate(-1 176 202)">You miss 100%</text>
  <text x="176" y="278" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="56" fill="#0969da" transform="rotate(-1 176 278)">of the shots</text>
  <text x="176" y="354" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="56" fill="#0969da" transform="rotate(-1 176 354)">you don't take.</text>
  <text x="568" y="416" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="38" fill="#57606a">- Wayne Gretzky</text>
  <text x="642" y="468" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="46" fill="#24292f">- Michael Scott</text>
  <g transform="translate(150 546)">
    <rect x="0" y="0" width="900" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="26" y="39" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#57606a">Same energy, slightly less legal paperwork than screenshotting NBC.</text>
  </g>
</svg>
