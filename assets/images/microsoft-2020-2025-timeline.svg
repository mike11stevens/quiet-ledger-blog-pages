<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="timeline-title timeline-desc">
  <title id="timeline-title">Microsoft and Mike Stevens, 2020 to 2025</title>
  <desc id="timeline-desc">A parallel timeline showing Microsoft milestones above the line and Mike Stevens's career milestones below it, with Microsoft's unadjusted month-end stock closing price overlaid from January 2020 through December 30, 2024. Microsoft milestones include the global shift to remote work, Azure OpenAI Service debuting and becoming generally available, ISV Success becoming generally available, and AI transformation accelerating across the partner ecosystem. Personal milestones include Enterprise Skills Initiative, joining Azure CXP and FastTrack for ISV, expanding digital-native and ISV work, building engineering feedback loops, focusing on AI, and publishing a fifteenth-year reflection a few weeks early in December 2024.</desc>
