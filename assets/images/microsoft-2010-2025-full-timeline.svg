<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="full-title full-desc">
  <title id="full-title">Microsoft and Mike Stevens, 2010 to 2025</title>
  <desc id="full-desc">A fifteen-year parallel timeline showing Microsoft milestones above the line and Mike Stevens's career milestones below it, with 180 unadjusted month-end Microsoft stock closing prices from January 2010 through December 30, 2024. Company milestones include Azure general availability, Office 365, Satya Nadella becoming CEO, Microsoft joining the Linux Foundation, the GitHub acquisition, remote work, and Azure OpenAI. Career milestones include joining Microsoft, anniversary reflections, moving to Germany, returning to the United States, Azure training, Azure CXP, FastTrack for ISV, and portfolio-scale engagement.</desc>
