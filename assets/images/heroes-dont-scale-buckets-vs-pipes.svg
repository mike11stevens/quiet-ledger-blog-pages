    <text x="405" y="125" fill="#f4ead2" font-family="monospace" font-size="44" text-anchor="middle">HEROIC WORKAROUND</text>
    <text x="1195" y="125" fill="#f4ead2" font-family="monospace" font-size="44" text-anchor="middle">WORKING SYSTEM</text>
