<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hero carrying buckets versus a system of pipes</title>
  <desc id="desc">Original retro pixel-art comparison: one exhausted worker carries buckets on the left while a network of green pipes moves information reliably on the right.</desc>
  <rect width="1600" height="900" fill="#101826"/>
  <g shape-rendering="crispEdges">
    <rect x="40" y="60" width="730" height="760" fill="#2b3344"/>
