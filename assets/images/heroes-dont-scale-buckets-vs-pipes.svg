    <rect x="120" y="220" width="100" height="80" fill="#c04b4b"/>
    <rect x="535" y="190" width="110" height="90" fill="#c04b4b"/>
    <rect x="110" y="330" width="120" height="85" fill="#c04b4b"/>
    <text x="405" y="775" fill="#f3d45b" font-family="monospace" font-size="30" text-anchor="middle">ONE PERSON. EVERY TIME.</text>
